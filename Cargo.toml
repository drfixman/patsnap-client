[package]
name = "patsnap-client"
version = "0.0.2"
edition = "2024"
publish = true
description = "Async client for the PatSnap Open Platform patent API: claims, description, bibliography, family, images, PDF, search."
license = "MIT"
repository = "https://github.com/drfixman/patsnap-client"
homepage = "https://github.com/drfixman/patsnap-client"
documentation = "https://docs.rs/patsnap-client"
readme = "README.md"
keywords = ["patsnap", "patents", "api-client", "search"]
categories = ["api-bindings", "web-programming::http-client"]
exclude = ["fuzz/"]

[lib]
name = "patsnap"

[workspace]

[dependencies]
reqwest = { version = "0.13", features = ["json", "query"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["sync", "time"] }
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "test-util"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
wiremock = "0.6"
